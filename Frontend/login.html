<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITNESS | Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="login-page">
    <main class="page">
        <h1>Login <span>Page</span></h1>

        <div class="login__container">
            <form class="login__form">
                <button type="button" class="login__back" id="login-back">&larr; Back</button>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div>
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn"><i class="bi bi-box-arrow-in-right auth-icon"></i>Login</button>
                <small class="login__error" id="login-error"></small>
            </form>

            <div class="login__links">
                <a href="admin.html"><i class="bi bi-shield-lock auth-icon"></i>Admin</a>
                <a href="register.html">Register</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 FITNESS Gym. All rights reserved.</p>
    </footer>
    <script>
        document.getElementById('login-back').addEventListener('click', function () {
            var previousPage = document.referrer;
            var sameSite = previousPage && new URL(previousPage).origin === window.location.origin;

            if (sameSite) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
    <script src="auth.js"></script>
</body>

</html>
