<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITNESS | Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="login-page">
    <main class="page">
        <h1>Member <span>Login</span></h1>
        <div class="login__container">
            <form class="login__form" id="login-form">
                <button type="button" class="login__back" id="login-back">&larr; Back</button>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div>
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <button type="button" class="password-toggle" id="password-toggle" aria-controls="password" aria-label="Show password">Show</button>
                    </div>
                </div>
                <button type="submit" class="btn">Enter FITNESS</button>
                <small class="login__error" id="login-error"></small>
            </form>
            <div class="login__links">
                <a href="admin.html" class="admin-link">Admin Login</a>
                <a href="register.html">Need an account? Register</a>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 FITNESS Gym. All rights reserved.</p></footer>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/page-transition.js"></script>
</body>
</html>
