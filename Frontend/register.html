<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITNESS | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="page">
        <h1>Register <span>Page</span></h1>
        <div class="login__container">
            <form class="login__form" id="register-form">
                <button type="button" class="login__back" id="register-back">&larr; Back</button>
                <div>
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" placeholder="Enter your email" required>
                </div>
                <div>
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" placeholder="Create a password" required>
                </div>
                <button type="submit" class="btn">Register</button>
                <small class="login__error" id="register-error"></small>
            </form>
            <div class="login__links login__links--centered">
                <a href="login.html">Already registered? Login</a>
            </div>
        </div>
    </main>
    <footer><p>&copy; 2026 FITNESS Gym. All rights reserved.</p></footer>
    <script src="register.js"></script>
</body>
</html>
